name: Check free invoice pipeline
on:
  workflow_dispatch:
jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pypdf>=5,<7'
      - run: python scripts/setup_data.py
      - run: python scripts/preflight.py
      - run: python tests_local.py
      - run: python methods/method1_programmatic.py
      - run: python evaluation/compare_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: |
            outputs/method1_programmatic.csv
            evaluation/
